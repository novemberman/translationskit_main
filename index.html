<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12151C" />
<title>Interlingo Console — Live Interpretation</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============================= LOGIN ============================= -->
<main id="loginScreen" class="screen">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Interlingo Console</h1>
    </div>
    <p class="brand-tagline">Sign in to join the interpretation booth.</p>

    <form id="loginForm" novalidate>
      <label class="field">
        <span>Username</span>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn btn-primary" id="loginSubmit">Sign in</button>
      <p class="field-error" id="loginError" role="alert" aria-live="polite"></p>
    </form>
  </div>
</main>

<!-- ============================= CONSOLE ============================= -->
<main id="consoleScreen" class="screen hidden">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Interlingo Console</span>
    </div>
    <div class="topbar-right">
      <span class="welcome" id="welcomeText"></span>
      <button class="btn btn-ghost" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <div class="console-grid">

    <!-- Source video -->
    <section class="panel panel-video" aria-label="Original broadcast">
      <div class="panel-heading">
        <h2>Source</h2>
        <div class="panel-heading-controls">
          <span class="status-pill" id="connectionPill" title="Connection quality">—</span>
          <span class="status-pill" id="playStatusPill">connecting…</span>
          <button type="button" class="btn btn-icon" id="reloadSourceBtn" title="Reload source stream" aria-label="Reload source stream">⟳</button>
        </div>
      </div>
      <div class="video-frame">
        <video id="remoteVideo" autoplay playsinline></video>
        <button type="button" class="autoplay-overlay hidden" id="autoplayOverlay">
          Tap to start playback
        </button>
      </div>
    </section>

    <!-- Interpreter controls -->
    <section class="panel panel-controls" aria-label="Interpreter controls">
      <div class="panel-heading">
        <h2>Booth</h2>
      </div>

      <label class="field">
        <span>Output language</span>
        <select id="languageSelect"></select>
      </label>

      <div class="stream-id-readout">
        <span class="label">Publishing as</span>
        <code id="streamIdReadout">—</code>
      </div>

      <button class="btn btn-ghost hidden" id="enableAudioBtn">Enable audio</button>

      <button class="btn btn-mic" id="micToggle" aria-pressed="false" disabled>
        <span class="mic-dot" aria-hidden="true"></span>
        <span id="micToggleLabel">Start interpreting</span>
      </button>

      <p class="field-error" id="publishError" role="alert" aria-live="polite"></p>
      <p class="hint">Headphones strongly recommended — without them, the original audio can bleed into your mix even with echo cancellation on.</p>
    </section>

    <!-- Meters -->
    <section class="panel panel-meters" aria-label="Audio levels">
      <div class="panel-heading">
        <h2>Signal chain</h2>
      </div>

      <div class="signal-chain">
        <div class="signal-node">
          <span class="signal-label">Original</span>
          <canvas class="meter" id="meterRemote" width="220" height="28"></canvas>
        </div>
        <div class="signal-arrow" aria-hidden="true">+</div>
        <div class="signal-node">
          <span class="signal-label">Mic</span>
          <canvas class="meter" id="meterMic" width="220" height="28"></canvas>
        </div>
        <div class="signal-arrow" aria-hidden="true">=</div>
        <div class="signal-node signal-node-output">
          <span class="signal-label">Published mix</span>
          <canvas class="meter" id="meterOutput" width="220" height="28"></canvas>
        </div>
      </div>
    </section>
    <section>
        <button id="recordOutputBtn">Record Output</button>
        <button id="stopRecordBtn" disabled>Stop Recording</button>
        <button id="downloadOutputBtn" disabled>Download Recording</button>
    </section>

  </div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
